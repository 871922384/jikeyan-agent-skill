[project]
name = "jikeyan-mcp"
version = "0.2.1"
description = "Official MCP server for 极科研 (jikeyan): manage research projects from your AI agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "research", "jikeyan", "agent-skills"]
authors = [{ name = "jikeyan" }]
urls = { Homepage = "https://jikeyan.cn", Repository = "https://github.com/871922384/jikeyan-agent-skill" }
dependencies = [
    "fastmcp>=4.1.6,<5.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.1,<2.0",
]

[project.scripts]
jikeyan-mcp = "jikeyan_mcp.server:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]
