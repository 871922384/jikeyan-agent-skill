name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  ghcr:
    name: Build and push MCP image to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      IMAGE: ghcr.io/871922384/jikeyan-mcp
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.1.0

      - name: Check tag matches package versions
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch: derive expected version from the manifests
            TAG_VERSION="$(python3 scripts/release_versions.py --print pyproject)"
          fi
          echo "Tag/manual version: ${TAG_VERSION}"
          python3 scripts/release_versions.py --check "${TAG_VERSION}"
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./mcp
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

  pypi:
    name: Publish to PyPI (Trusted Publishing)
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up uv
        # setup-uv publishes only full-version tags since v8 (no major tags);
        # pin the full version tag. SHA: 68559e99cc807c1eb7e9238fd43a15bba460eec2
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Check tag matches package versions
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch: derive expected version from the manifests
            TAG_VERSION="$(python3 scripts/release_versions.py --print pyproject)"
          fi
          echo "Tag/manual version: ${TAG_VERSION}"
          python3 scripts/release_versions.py --check "${TAG_VERSION}"
          echo "VERSION=${TAG_VERSION}" >> "${GITHUB_ENV}"

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          cd mcp
          uv build

      - name: Run MCP tests
        run: |
          set -euo pipefail
          cd mcp
          uv run --extra test pytest

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp/dist/
          print-hash: true

  mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: ghcr
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Wait for GHCR image to be available
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(python3 scripts/release_versions.py --print pyproject)"
          fi
          echo "Waiting for ghcr.io/871922384/jikeyan-mcp:${VERSION}..."
          for i in $(seq 1 30); do
            TOKEN="$(curl --fail --silent --show-error "https://ghcr.io/token?service=ghcr.io&scope=repository:871922384/jikeyan-mcp:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/871922384/jikeyan-mcp/manifests/${VERSION}" > /dev/null; then
              echo "Found ghcr.io/871922384/jikeyan-mcp:${VERSION} (attempt ${i})."
              exit 0
            fi
            echo "Attempt ${i}/30: not yet visible, sleeping 10s..."
            sleep 10
          done
          echo "ERROR: ghcr.io/871922384/jikeyan-mcp:${VERSION} did not appear within ~5 minutes." >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${base_url}/${archive}"
          curl --fail --location --silent --show-error --output "${archive}.sigstore.json" "${base_url}/${archive}.sigstore.json"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${archive}"
          tar xzf "${archive}" mcp-publisher
          rm -f "${archive}" "${archive}.sigstore.json"
          ./mcp-publisher --help

      - name: Authenticate to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher publish

      - name: Verify registry listing
        run: |
          set -euo pipefail
          resp="$(curl --fail --silent --show-error "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.871922384%2Fjikeyan-agent-skill")"
          echo "${resp}" | head -c 2000
          echo ""
          if ! echo "${resp}" | grep -q "io.github.871922384/jikeyan-agent-skill"; then
            echo "ERROR: server not found in registry search results." >&2
            exit 1
          fi
          echo "Registry verification passed."
