name: checks

on:
  push:
  pull_request:

jobs:
  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SKILL.md frontmatter and manifest JSON
        run: python - <<'EOF'
          import json
          from pathlib import Path

          root = Path(".")
          for skill in ["plugins/jikeyan/skills/jikeyan-agent/SKILL.md",
                        "plugins/jikeyan/skills/jikeyan-academic-colleague/SKILL.md"]:
              text = (root / skill).read_text(encoding="utf-8")
              assert text.startswith("---\n"), skill
              frontmatter = text.split("---\n", 2)[1]
              assert "name:" in frontmatter and "description:" in frontmatter, skill
              print(f"frontmatter OK: {skill}")

          marketplace = json.loads((root / ".claude-plugin/marketplace.json").read_text())
          plugin = json.loads((root / "plugins/jikeyan/.claude-plugin/plugin.json").read_text())
          mcp_json = json.loads((root / "plugins/jikeyan/.mcp.json").read_text())
          server = json.loads((root / "server.json").read_text())
          assert marketplace["plugins"][0]["name"] == plugin["name"], "entry/manifest name mismatch"
          assert "jikeyan" in mcp_json["mcpServers"], ".mcp.json server missing"
          assert len(server["description"]) <= 100, "registry description > 100 chars"
          pkg = server["packages"][0]
          assert pkg["registryType"] == "pypi" and pkg["identifier"] == "jikeyan-mcp"
          assert "mcp-name: io.github.871922384/jikeyan-agent-skill" in (
              root / "mcp/README.md").read_text(), "mcp-name token missing"
          print("manifests OK")
          EOF

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get update -y -qq && sudo apt-get install -y -qq shellcheck || true
          shellcheck -S warning plugins/jikeyan/skills/jikeyan-agent/scripts/jikeyan.sh

  mcp-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test deps
        run: pip install -e "mcp[test]"
      - name: Run MCP tests
        run: python -m pytest mcp/tests -q
