name: checks

on:
  push:
  pull_request:

jobs:
  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SKILL.md frontmatter and manifest JSON
        run: python scripts/check_manifests.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck -S warning plugins/jikeyan/skills/jikeyan-agent/scripts/jikeyan.sh

  mcp-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test deps
        run: pip install -e "mcp[test]"
      - name: Run MCP tests
        run: python -m pytest mcp/tests -q
